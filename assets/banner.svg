<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 280" width="1100" height="280" role="img" aria-label="InstaBOT">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#833ab4"/>
      <stop offset="45%" stop-color="#c13584"/>
      <stop offset="100%" stop-color="#f77737"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f77737"/>
      <stop offset="50%" stop-color="#c13584"/>
      <stop offset="100%" stop-color="#833ab4"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1100" height="280" rx="22" fill="#0b0d12"/>

  <!-- animated grid -->
  <g opacity="0.16">
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#5b7cff" stroke-width="1"/>
    </pattern>
    <rect width="1100" height="280" fill="url(#grid)">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="44 44" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- rotating conic sheen -->
  <g transform="translate(120,140)">
    <circle r="62" fill="none" stroke="url(#g2)" stroke-width="3" stroke-dasharray="10 14" opacity="0.85">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="46" fill="url(#g)" filter="url(#glow2)">
      <animate attributeName="opacity" values="0.85;1;0.85" dur="4s" repeatCount="indefinite"/>
    </circle>
    <text x="0" y="10" text-anchor="middle" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="34" font-weight="800" fill="#fff">IB</text>
  </g>

  <!-- wordmark with gradient sweep -->
  <text x="220" y="132" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="76" font-weight="800" fill="url(#g2)" filter="url(#glow)">
    InstaBOT
    <animate attributeName="opacity" values="1;0.9;1" dur="5s" repeatCount="indefinite"/>
  </text>
  <text x="224" y="176" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="21" fill="#98a2bd">
    A modular Instagram Direct chat bot
    <animate attributeName="opacity" values="0;1;1;0" dur="6s" repeatCount="indefinite" keyTimes="0;0.08;0.9;1"/>
  </text>

  <!-- typing cursor -->
  <rect x="540" y="160" width="10" height="20" fill="#c13584">
    <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
  </rect>

  <!-- typing dots -->
  <g transform="translate(220,214)">
    <circle cx="0" cy="0" r="6" fill="#c13584">
      <animate attributeName="cy" values="0;-8;0" dur="1.1s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <circle cx="24" cy="0" r="6" fill="#f77737">
      <animate attributeName="cy" values="0;-8;0" dur="1.1s" begin="0.18s" repeatCount="indefinite"/>
    </circle>
    <circle cx="48" cy="0" r="6" fill="#833ab4">
      <animate attributeName="cy" values="0;-8;0" dur="1.1s" begin="0.36s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- floating badges -->
  <g transform="translate(760,70)" opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="760 70;760 60;760 70" dur="5s" repeatCount="indefinite"/>
    <rect width="300" height="40" rx="10" fill="#141824" stroke="#2a3145"/>
    <text x="18" y="26" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#3ddc84">● music · effects · events</text>
  </g>
  <g transform="translate(760,124)" opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="760 124;760 132;760 124" dur="4.2s" repeatCount="indefinite"/>
    <rect width="300" height="40" rx="10" fill="#141824" stroke="#2a3145"/>
    <text x="18" y="26" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#9fb4ff">by Saifullah Al Neoaz</text>
  </g>
  <g transform="translate(760,178)" opacity="0.95">
    <animateTransform attributeName="transform" type="translate" values="760 178;760 172;760 178" dur="4.8s" repeatCount="indefinite"/>
    <rect width="300" height="40" rx="10" fill="#141824" stroke="#2a3145"/>
    <text x="18" y="26" font-family="ui-monospace,Menlo,monospace" font-size="14" fill="#ffd27a">MIT licensed</text>
  </g>

  <rect x="0" y="268" width="1100" height="12" fill="url(#g2)">
    <animate attributeName="opacity" values="0.6;1;0.6" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
